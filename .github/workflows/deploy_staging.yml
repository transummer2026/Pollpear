name: Deploy staging (dev.pollpear.com)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-dev-pollpear
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy dev.pollpear.com
    runs-on: [self-hosted, staging]
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Checkout (superproject only)
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: true
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Submodule auth (SSH -> HTTPS + token)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Checkout submodules (pinned SHAs)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
        run: bash Pollpear_infra/scripts/deploy.sh

