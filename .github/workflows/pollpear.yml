name: CI Pollpear

on:
  repository_dispatch:
    types: [sync-submodules]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pollpear CI déclenché"

  sync:
    name: Sync submodules
    runs-on: ubuntu-latest
    needs: trigger
    steps:
      - name: Checkout pollpear avec submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Configurer git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Mettre à jour les submodules
        run: |
          git submodule update --remote --merge
          git submodule foreach 'echo "$(basename $PWD): $(git rev-parse --short HEAD)"'

      - name: Vérifier cohérence des SHAs
        id: check
        run: |
          CHANGES=$(git status --porcelain)
          if [ -z "$CHANGES" ]; then
            echo "Aucun changement détecté dans les submodules"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changements détectés :"
            echo "$CHANGES"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit + Push snapshot
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git add .
          git commit -m "chore: sync submodules — sha ${{ github.event.client_payload.sha || github.sha }}"
          git push

      - name: Notify Discord — sync réussi
        if: steps.check.outputs.has_changes == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GLOBAL }}
          status: success
          title: "Pollpear — submodules synchronisés"
          description: "Snapshot mis à jour — sha ${{ github.event.client_payload.sha || github.sha }}"

      - name: Notify Discord — rien à synchroniser
        if: steps.check.outputs.has_changes == 'false'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GLOBAL }}
          status: success
          title: "Pollpear — déjà à jour"
          description: "Aucun changement dans les submodules"

      - name: Notify Discord — échec sync
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GLOBAL }}
          status: failure
          title: "Pollpear — échec sync submodules"
          color: 0xFF0000