name: Update Git Submodules

on:
  workflow_dispatch: 
  repository_dispatch:
    types: [submodule-update]   
  push:
    branches: [dev]

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:

      # https://medium.com/@rezaur.official/integrating-git-submodules-in-ci-c-the-real-world-guide-no-one-writes-497c7287af9f
      # actions/checkout@v3 deprecated -> v4
      - name: Checkout repo (include aubmodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
          fetch-depth: 1
          token: ${{ secrets.DISPATCH_TOKEN }}

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote --depth=1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Guard
        id: guard
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes in submodules."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Submodules updated. Committing changes."

      - name: commit and push changes
        if: steps.guard.outputs.changed == 'true'
        run: |
          git add .
          git commit -m "feat: Update submodules"
          git push origin dev

      - name: release-please prerelease
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          target-branch: dev
          config-file: release-please-config-dev.json
          manifest-file: .release-please-manifest.json

      - name: auto merge release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh pr merge ${{ fromJSON(steps.release.outputs.pr).number }} --squash --delete-branch

