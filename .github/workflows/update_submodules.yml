name: Update Git Submodules

on:
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-update]

concurrency:
  group: pollpear-submodule-update
  cancel-in-progress: false

jobs:
  update-submodules:
    uses: transummer2026/.github/.github/workflows/update-submodules.yml@main
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      DISCORD_WEBHOOK_GLOBAL: ${{ secrets.DISCORD_WEBHOOK_GLOBAL }}
