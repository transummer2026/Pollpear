name: PR deploy description (dev -> staging)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-deploy-desc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  describe:
    name: Fill PR description
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (PR head, full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false

      - name: Fill description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/pr_deploy_description.sh
