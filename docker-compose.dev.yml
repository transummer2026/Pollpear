services:

  postgres:
    image: postgres:16-alpine
    container_name: pollpear-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pollpear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollpear}
      POSTGRES_DB: ${POSTGRES_DB:-pollpear}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Pollpear_infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pollpear} -d ${POSTGRES_DB:-pollpear}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pollpear-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
      - ./Pollpear_infra/redis:/redis-init:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: ./Pollpear_gateway
      dockerfile: Dockerfile.dev
    container_name: pollpear-gateway
    environment:
      RUST_LOG: ${RUST_LOG:-debug}
      PORT: "8080"
      API_URL: http://api:3000
      FRONTEND_URL: http://frontend:5173
    volumes:
      - ./Pollpear_gateway:/app
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: on-failure

  api:
    build:
      context: ./Pollpear_api
      dockerfile: Dockerfile.dev
    container_name: pollpear-api
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-pollpear}:${POSTGRES_PASSWORD:-pollpear}@postgres:5432/${POSTGRES_DB:-pollpear}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./Pollpear_api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./Pollpear_frontend
      dockerfile: Dockerfile.dev
    container_name: pollpear-frontend
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./Pollpear_frontend:/app
    ports:
      - "5173:5173"
    restart: on-failure

  vault:
    image: ghcr.io/transummer2026/vault:latest
    container_name: pollpear-vault
    command: vault server -dev -dev-root-token-id=${VAULT_ROOT_TOKEN:-pollpear-dev-token}
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-pollpear-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
